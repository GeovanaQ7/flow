
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduFlow</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #070b14;
  color: white;
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 250px;
  background: #0f172a;
  padding: 25px;
  position: fixed;
  height: 100vh;
  border-right: 1px solid #1e293b;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 40px;
  color: #8b5cf6;
}

.sidebar button {
  width: 100%;
  margin-bottom: 15px;
}

.main {
  margin-left: 250px;
  width: 100%;
  padding: 30px;
}

.page {
  display: none;
}

.active {
  display: block;
}

.card {
  background: #111827;
  border: 1px solid #1f2937;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  transition: .3s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px rgba(139,92,246,0.3);
}

h1 {
  margin-bottom: 25px;
}

h2 {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #1e293b;
  color: white;
  margin-bottom: 15px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#7c3aed,#38bdf8);
  color: white;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  opacity: .9;
  transform: scale(1.02);
}

.auth {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 100vh;
}

.auth-card {
  width: 400px;
  background: #111827;
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 0 35px rgba(139,92,246,0.2);
}

.auth-card h1 {
  text-align: center;
  margin-bottom: 25px;
}

.progress-bar {
  width: 100%;
  height: 12px;
  background: #1e293b;
  border-radius: 50px;
  overflow: hidden;
  margin-top: 10px;
}

.progress {
  height: 100%;
  background: linear-gradient(90deg,#7c3aed,#38bdf8);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
  gap: 20px;
}

.lesson {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
}

.lesson button {
  margin-top: 10px;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #111827;
  border: 1px solid #7c3aed;
  padding: 15px 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(139,92,246,0.3);
  opacity: 0;
  transition: .4s;
  z-index: 999;
}

.toast.show {
  opacity: 1;
}

.chart {
  margin-top: 20px;
  height: 220px;
  display: flex;
  align-items: end;
  gap: 15px;
}

.bar {
  flex: 1;
  background: linear-gradient(180deg,#7c3aed,#38bdf8);
  border-radius: 12px 12px 0 0;
}

.small {
  color: #94a3b8;
  font-size: 14px;
}

@media(max-width: 900px) {

  .sidebar {
    width: 100px;
    padding: 15px;
  }

  .logo {
    font-size: 18px;
  }

  .main {
    margin-left: 100px;
  }

  .sidebar button {
    font-size: 12px;
    padding: 10px;
  }

}

</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="authScreen" class="auth">

  <div class="auth-card">

    <h1>EduFlow</h1>

    <div id="loginArea">

      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Senha">

      <button onclick="login()">Entrar</button>

      <br><br>

      <p>
        Não possui conta?
        <a href="#" onclick="showRegister()" style="color:#38bdf8;">
          Cadastre-se
        </a>
      </p>

    </div>

    <div id="registerArea" style="display:none;">

      <input type="text" id="registerName" placeholder="Nome">
      <input type="email" id="registerEmail" placeholder="Email">
      <input type="password" id="registerPassword" placeholder="Senha">

      <button onclick="register()">Cadastrar</button>

      <br><br>

      <p>
        Já possui conta?
        <a href="#" onclick="showLogin()" style="color:#38bdf8;">
          Fazer Login
        </a>
      </p>

    </div>

  </div>

</div>

<div id="app" style="display:none; width:100%;">

  <div class="sidebar">

    <div class="logo">EduFlow</div>

    <button onclick="openPage('dashboard')">Dashboard</button>
    <button onclick="openPage('courses')">Cursos</button>
    <button onclick="openPage('admin')">Admin</button>
    <button onclick="logout()">Sair</button>

  </div>

  <div class="main">

    <div id="dashboard" class="page active">

      <h1>Dashboard</h1>

      <div class="grid" id="dashboardCourses"></div>

      <div class="card">

        <h2>Gráfico de Progresso</h2>

        <div class="chart" id="chart"></div>

      </div>

    </div>

    <div id="courses" class="page">

      <h1>Meus Cursos</h1>

      <div id="coursesContainer"></div>

    </div>

    <div id="admin" class="page">

      <h1>Painel Administrativo</h1>

      <div class="card">

        <input type="text" id="courseInput" placeholder="Nome do curso">

        <button onclick="addCourse()">
          Adicionar Curso
        </button>

      </div>

      <div id="adminCourses"></div>

    </div>

  </div>

</div>

<script>
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.innerText = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

function saveCourses(courses) {
  localStorage.setItem('eduflow_courses', JSON.stringify(courses));
}

function getCourses() {
  return JSON.parse(localStorage.getItem('eduflow_courses')) || [];
}

function seedCourses() {
  if (!localStorage.getItem('eduflow_courses')) {
    const mock = [
      {
        id: Date.now(),
        name: 'JavaScript Moderno',
        modules: [
          {
            title: 'Fundamentos',
            lessons: [
              {
                title: 'Introdução ao JavaScript',
                completed: false
              },
              {
                title: 'Variáveis e Tipos',
                completed: false
              }
            ]
          }
        ]
      }
    ];
    saveCourses(mock);
  }
}

seedCourses();

function showRegister() {
  document.getElementById('loginArea').style.display = 'none';
  document.getElementById('registerArea').style.display = 'block';
}

function showLogin() {
  document.getElementById('registerArea').style.display = 'none';
  document.getElementById('loginArea').style.display = 'block';
}

function register() {
  const user = {
    name: document.getElementById('registerName').value,
    email: document.getElementById('registerEmail').value,
    password: document.getElementById('registerPassword').value
  };

  if (!user.name || !user.email || !user.password) {
    return showToast('Preencha todos os campos');
  }

  localStorage.setItem('eduflow_user', JSON.stringify(user));

  showToast('Conta criada com sucesso');

  showLogin();
}

function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  const user = JSON.parse(localStorage.getItem('eduflow_user'));

  if (!user) {
    return showToast('Crie uma conta primeiro');
  }

  if (user.email === email && user.password === password) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    renderDashboard();
    renderCourses();
    renderAdmin();

    showToast('Login realizado');
  } else {
    showToast('Email ou senha inválidos');
  }
}

function logout() {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function openPage(page) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');
}

function calculateProgress(course) {
  let total = 0;
  let completed = 0;

  course.modules.forEach(module => {
    module.lessons.forEach(lesson => {
      total++;
      if (lesson.completed) completed++;
    });
  });

  return Math.floor((completed / total) * 100) || 0;
}

function renderDashboard() {
  const container = document.getElementById('dashboardCourses');
  const chart = document.getElementById('chart');

  container.innerHTML = '';
  chart.innerHTML = '';

  const courses = getCourses();

  courses.forEach(course => {
    const progress = calculateProgress(course);

    container.innerHTML += `
      <div class="card">
        <h2>${course.name}</h2>

        <p class="small">${progress}% concluído</p>

        <div class="progress-bar">
          <div class="progress" style="width:${progress}%"></div>
        </div>

        <br>

        <button onclick="openPage('courses')">
          Continuar Estudando
        </button>
      </div>
    `;

    chart.innerHTML += `
      <div class="bar" style="height:${progress * 2}px"></div>
    `;
  });
}

function renderCourses() {
  const container = document.getElementById('coursesContainer');

  container.innerHTML = '';

  const courses = getCourses();

  courses.forEach(course => {
    const progress = calculateProgress(course);

    let modulesHTML = '';

    course.modules.forEach((module, moduleIndex) => {
      let lessonsHTML = '';

      module.lessons.forEach((lesson, lessonIndex) => {
        lessonsHTML += `
          <div class="lesson">
            <h3>${lesson.title}</h3>

            <p class="small">
              ${lesson.completed ? 'Concluída' : 'Pendente'}
            </p>

            <button onclick="completeLesson(${course.id}, ${moduleIndex}, ${lessonIndex})">
              ${lesson.completed ? 'Finalizada' : 'Concluir Aula'}
            </button>
          </div>
        `;
      });

      modulesHTML += `
        <div class="card">
          <h2>${module.title}</h2>
          ${lessonsHTML}
        </div>
      `;
    });

    container.innerHTML += `
      <div class="card">
        <h2>${course.name}</h2>

        <p>${progress}% concluído</p>

        <div class="progress-bar">
          <div class="progress" style="width:${progress}%"></div>
        </div>

        <br>

        ${modulesHTML}
      </div>
    `;
  });
}

function completeLesson(courseId, moduleIndex, lessonIndex) {
  const courses = getCourses();

  const course = courses.find(c => c.id === courseId);

  course.modules[moduleIndex].lessons[lessonIndex].completed = true;

  saveCourses(courses);

  renderCourses();
  renderDashboard();

  showToast('Aula concluída');
}

function addCourse() {
  const input = document.getElementById('courseInput');

  if (!input.value) {
    return showToast('Digite o nome do curso');
  }

  const courses = getCourses();

  courses.push({
    id: Date.now(),
    name: input.value,
    modules: []
  });

  saveCourses(courses);

  input.value = '';

  renderAdmin();
  renderCourses();
  renderDashboard();

  showToast('Curso adicionado');
}

function renderAdmin() {
  const container = document.getElementById('adminCourses');

  container.innerHTML = '';

  const courses = getCourses();

  courses.forEach(course => {
    container.innerHTML += `
      <div class="card">
        <h2>${course.name}</h2>

        <button onclick="addModule(${course.id})">
          Adicionar Módulo
        </button>
      </div>
    `;
  });
}

function addModule(courseId) {
  const title = prompt('Nome do módulo');

  if (!title) return;

  const courses = getCourses();

  const course = courses.find(c => c.id === courseId);

  course.modules.push({
    title,
    lessons: []
  });

  saveCourses(courses);

  renderAdmin();
  renderCourses();

  showToast('Módulo criado');

  setTimeout(() => {
    addLesson(courseId, course.modules.length - 1);
  }, 300);
}

function addLesson(courseId, moduleIndex) {
  const title = prompt('Nome da aula');

  if (!title) return;

  const courses = getCourses();

  const course = courses.find(c => c.id === courseId);

  course.modules[moduleIndex].lessons.push({
    title,
    completed: false
  });

  saveCourses(courses);

  renderCourses();
  renderDashboard();

  showToast('Aula adicionada');
}
</script>
</body>
</html>
